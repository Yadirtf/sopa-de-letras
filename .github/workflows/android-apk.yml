# Compila la APK de WordHive y la publica para descargar desde GitHub.
#
# - Pull request: compila y prueba (la APK queda como artefacto del run).
# - Push a main: además actualiza el Release "latest" (prerelease) con la APK.
# - Tag v*: crea un Release estable con la APK (p. ej. v1.2.0).
#
# Secretos opcionales para firmar con tu propia clave (recomendado, así cada
# versión se instala encima de la anterior sin desinstalar):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
# Variables opcionales del repo: API_URL y SOCKET_URL (si no, se usa Render).
#
# Secreto opcional para avisos push con la app cerrada (Firebase Cloud Messaging):
#   GOOGLE_SERVICES_JSON = contenido de google-services.json (Firebase → Configuración
#   del proyecto → app Android com.example.wordhive_app). Sin él la APK compila igual.
name: Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    paths: ['app/**', '.github/workflows/android-apk.yml']
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    env:
      API_URL: ${{ vars.API_URL || 'https://wordhive-api.onrender.com/api/v1' }}
      SOCKET_URL: ${{ vars.SOCKET_URL || 'https://wordhive-api.onrender.com' }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.GOOGLE_SERVICES_JSON != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependencias
        run: flutter pub get

      - name: Análisis estático
        run: flutter analyze --no-fatal-infos

      - name: Pruebas
        run: flutter test

      - name: Keystore de release (si hay secretos)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        if: env.HAS_KEYSTORE == 'true'
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks
          cat > android/key.properties <<EOF
          storeFile=release.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Firebase para avisos push (si hay secreto)
        if: env.HAS_FIREBASE == 'true'
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          # Acepta el JSON tal cual o en base64.
          if printf '%s' "$GOOGLE_SERVICES_JSON" | head -c1 | grep -q '{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
          fi
          python3 -c "import json;d=json.load(open('android/app/google-services.json'));print('Firebase:', d['project_info']['project_id'])"

      - name: Aviso si la APK sale sin Firebase
        if: env.HAS_FIREBASE != 'true'
        run: echo "::warning title=APK sin avisos push::Falta el secreto GOOGLE_SERVICES_JSON. Esta APK no recibirá avisos con la app cerrada (ver docs/DEPLOY_RENDER_AND_APK.md §4)."

      - name: Versión
        id: version
        run: |
          base=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then name="${GITHUB_REF_NAME#v}"; else name="$base"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "file=wordhive-$name-build${{ github.run_number }}.apk" >> "$GITHUB_OUTPUT"

      - name: Compilar APK release
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_URL=$API_URL \
            --dart-define=SOCKET_URL=$SOCKET_URL
          mv build/app/outputs/flutter-apk/app-release.apk "build/${{ steps.version.outputs.file }}"

      - uses: actions/upload-artifact@v4
        with:
          name: wordhive-apk
          path: app/build/${{ steps.version.outputs.file }}
          retention-days: 30

      - name: Publicar Release "latest" (main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest "build/${{ steps.version.outputs.file }}" \
            --prerelease --target "$GITHUB_SHA" \
            --title "WordHive · última versión de main" \
            --notes "APK compilada automáticamente desde main (commit ${GITHUB_SHA::7}). Descárgala en Android y ábrela para instalar."

      - name: Publicar Release del tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" "build/${{ steps.version.outputs.file }}" --clobber \
            || gh release create "$GITHUB_REF_NAME" "build/${{ steps.version.outputs.file }}" \
                 --title "WordHive $GITHUB_REF_NAME" --generate-notes
