name: wordhive_app
description: "WordHive - Sopa de letras multijugador en tiempo real"
version: 1.0.0+1
publish_to: "none"

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navegacion
  go_router: ^13.2.0

  # Red
  dio: ^5.4.3
  socket_io_client: ^2.0.3+1

  # Almacenamiento local
  flutter_secure_storage: ^9.0.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  flutter_local_notifications: ^17.1.2
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.1.0
  cached_network_image: ^3.3.1

  # Utilidades
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5
  dartz: ^0.10.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  riverpod_generator: ^2.4.0
  hive_generator: ^2.0.1
  mocktail: ^1.0.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    # Avatares (ver tool/avatars/README.md para regenerarlos y sus licencias)
    - assets/avatars/animales/
    - assets/avatars/aventureros/
    - assets/avatars/fantasia/
    - assets/avatars/profesiones/
    - assets/avatars/comic/
    - assets/avatars/sonrisas/
    - assets/avatars/robots/
    - assets/avatars/pixel/
    - assets/avatars/caritas/
    - assets/avatars/retratos/
    - assets/avatars/bocetos/
    - assets/avatars/LICENSES.txt


