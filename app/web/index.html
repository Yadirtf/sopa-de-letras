<!DOCTYPE html>
<html lang="es">
<head>
  <!-- La app se publica en /jugar/: `flutter build web --base-href /jugar/`. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="Juega WordHive desde el navegador: sopas de letras con amigos y familia, en tiempo real.">
  <meta name="theme-color" content="#080B14">
  <meta name="color-scheme" content="dark">

  <!-- Instalable como app (PWA) en móvil y escritorio -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WordHive">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>WordHive · Jugar</title>

  <style>
    html, body { margin: 0; height: 100%; background: #080B14; }
    #wh-splash {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 20px; background: radial-gradient(circle at 50% 35%, #1B1238 0%, #080B14 70%);
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif; color: #F0F4FF;
      transition: opacity .35s ease;
    }
    #wh-splash img { width: 112px; height: 112px; border-radius: 28px; animation: wh-bob 1.6s ease-in-out infinite; }
    #wh-splash strong { font-size: 26px; letter-spacing: -0.02em; }
    #wh-splash span { font-size: 15px; color: #8892A4; }
    #wh-splash.wh-hide { opacity: 0; pointer-events: none; }
    @keyframes wh-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @media (prefers-reduced-motion: reduce) { #wh-splash img { animation: none; } }
  </style>
</head>
<body>
  <!-- Pantalla de carga con la Abejita mientras llega el motor de Flutter -->
  <div id="wh-splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <strong>WordHive</strong>
    <span>Preparando tu sopa de letras…</span>
  </div>
  <noscript>
    <p style="color:#F0F4FF;text-align:center;font-family:sans-serif;padding:24px">
      Para jugar a WordHive necesitas activar JavaScript en tu navegador.
    </p>
  </noscript>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('wh-splash');
      if (!splash) return;
      splash.classList.add('wh-hide');
      setTimeout(function () { splash.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
