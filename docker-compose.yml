services:
  db:
    image: postgres:15-alpine
    container_name: sopadeletras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sopadeletras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sopadeletras_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sopadeletras}
    ports:
      - "${PORT_DB_HOST:-5433}:5432"
    volumes:
      - sopadeletras_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sopadeletras}"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - sopadeletras-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: sopadeletras-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-sopadeletras}:${POSTGRES_PASSWORD:-sopadeletras_pass}@sopadeletras-db:5432/${POSTGRES_DB:-sopadeletras}
      JWT_SECRET: ${JWT_SECRET:-cambia-este-secreto-en-produccion-abc123}
      API_PORT: 3001
    ports:
      - "${PORT_API_HOST:-3005}:3001"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sopadeletras-net
      - proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  web:
    build:
      context: apps/web
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-}
        - VITE_WS_URL=${VITE_WS_URL:-}
    container_name: sopadeletras-web
    restart: unless-stopped
    ports:
      - "${PORT_WEB_HOST:-5174}:80"
    depends_on:
      - api
    networks:
      - sopadeletras-net
      - proxy-network
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

networks:
  sopadeletras-net:
    driver: bridge
  proxy-network:
    external: true

volumes:
  sopadeletras_db_data:
