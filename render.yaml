# WordHive — render.yaml
# Configuracion oficial de Blueprint para Render.com
# Documentacion: https://render.com/docs/blueprint-spec

services:
  # 1. API Backend (Node.js + Fastify + Socket.IO)
  - type: web
    name: wordhive-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: wordhive-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wordhive-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 7d
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: noreply@wordhive.com
      - key: SMTP_PASS
        value: changeme
      - key: SMTP_FROM
        value: noreply@wordhive.com
      - key: APP_URL
        value: https://wordhive-api.onrender.com
      - key: FRONTEND_URL
        value: https://wordhive-landing.onrender.com

  # 2. Key Value Cache (Redis / Valkey compatible en Render)
  - type: keyvalue
    name: wordhive-redis
    plan: free
    ipAllowList: []

  # 3. Landing Page Web (Vite Static Site)
  - type: web
    name: wordhive-landing
    runtime: static
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        value: https://wordhive-api.onrender.com/api/v1
      - key: VITE_SOCKET_URL
        value: https://wordhive-api.onrender.com
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 4. Base de Datos Relacional PostgreSQL (Managed por Render)
  - name: wordhive-db
    databaseName: wordhive
    user: wordhive_user
    plan: free
