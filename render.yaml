# WordHive — render.yaml
# Configuracion oficial de Blueprint para Render.com
# Documentacion: https://render.com/docs/blueprint-spec

services:
  # 1. API Backend (Node.js + Fastify + Socket.IO)
  - type: web
    name: wordhive-api
    runtime: node
    rootDir: backend
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npm run build
    startCommand: npx prisma db push --accept-data-loss && node dist/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_URL
        fromDatabase:
          name: wordhive-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: wordhive-redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 7d
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: SMTP_HOST
        value: smtp.example.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        value: noreply@wordhive.com
      - key: SMTP_PASS
        value: changeme
      - key: SMTP_FROM
        value: noreply@wordhive.com
      - key: APP_URL
        value: https://wordhive-api.onrender.com
      - key: FRONTEND_URL
        value: https://wordhive-landing.onrender.com
      # Version web del juego: enlaces de invitacion, QR y clic en avisos push.
      - key: PLAY_URL
        value: https://wordhive-landing.onrender.com/jugar
      # Cuenta de servicio de Firebase para avisos push (pegar el JSON en Render).
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false

  # 2. Key Value Cache (Redis / Valkey compatible en Render)
  - type: keyvalue
    name: wordhive-redis
    plan: free
    ipAllowList: []

  # 3. Landing + version web del juego (sitio estatico)
  #    /        -> landing (web/, Vite)
  #    /jugar/  -> la app Flutter compilada para web (app/), con todas sus funciones
  - type: web
    name: wordhive-landing
    runtime: static
    buildCommand: cd web && npm ci && npm run build && cd .. && bash app/tool/web/build_web.sh web/dist
    staticPublishPath: ./web/dist
    buildFilter:
      paths:
        - web/**
        - app/**
    envVars:
      - key: VITE_API_URL
        value: https://wordhive-api.onrender.com/api/v1
      - key: PLAY_URL
        value: https://wordhive-landing.onrender.com/jugar
      - key: API_URL
        value: https://wordhive-api.onrender.com/api/v1
      - key: SOCKET_URL
        value: https://wordhive-api.onrender.com
      # Opcionales: avisos push con el navegador cerrado (consola de Firebase).
      - key: FIREBASE_WEB_CONFIG
        sync: false
      - key: FIREBASE_VAPID_KEY
        sync: false
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      - type: redirect
        source: /jugar
        destination: /jugar/
      # Recargar o abrir un enlace dentro del juego (/jugar/room/ABC123) sirve la app.
      - type: rewrite
        source: /jugar/*
        destination: /jugar/index.html
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 4. Base de Datos Relacional PostgreSQL (Managed por Render)
  - name: wordhive-db
    databaseName: wordhive
    user: wordhive_user
    plan: free
