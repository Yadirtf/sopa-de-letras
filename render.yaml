# WordHive — render.yaml
# Configuracion de despliegue en Render.com
# Documentacion: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: wordhive-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npx prisma migrate deploy && node dist/app.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wordhive-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: wordhive-redis
          type: redis
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 7d
      - key: JWT_REFRESH_EXPIRY
        value: 30d
      - key: PORT
        value: 3000

  - type: web
    name: wordhive-landing
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: wordhive-db
    databaseName: wordhive
    user: wordhive_user
    plan: free

  - name: wordhive-redis
    type: redis
    plan: free
